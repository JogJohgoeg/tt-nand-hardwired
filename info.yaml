# Modified from the official Tiny Tapeout SKY130 template.
project:
  title: "Auditable NAND hard logic and ternary dot product"
  author: "JogJohgoeg / TapeOut contributors"
  discord: ""
  description: "Circuit 279 and DOT32_T from pinned NAND netlists, with a serial interface"
  language: "Verilog"
  clock_hz: 10000000
  tiles: "2x2"
  top_module: "tt_um_jogjohgoeg_hardwired"
  source_files:
    - "project.v"
    - "cell_279.v"
    - "dot32_t.v"
pinout:
  ui[0]: "DIN (MSB first)"
  ui[1]: "CS_n (0 = selected)"
  ui[2]: "SHIFT"
  ui[3]: "CORE (0 = circuit 279, 1 = DOT32_T)"
  ui[4]: "RUN"
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""
  uo[0]: "DOUT (sample before SHIFT edge)"
  uo[1]: "RESPONSE (unread bits remain)"
  uo[2]: "CORE echo (live)"
  uo[3]: ""
  uo[4]: ""
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""
